<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="OBLICUA — plugins, servidores y diseño para Minecraft">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0818"/>
      <stop offset="1" stop-color="#1C1140"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8868FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8868FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B9A6FF"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="300" rx="28"/></clipPath>
    <style>
      .p{fill:#B9A6FF;animation:tw 4s ease-in-out infinite}
      .d1{animation-delay:.8s}.d2{animation-delay:1.6s}.d3{animation-delay:2.4s}.d4{animation-delay:3.2s}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif;font-weight:700}
      .s{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
    </style>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <ellipse cx="600" cy="340" rx="560" ry="230" fill="url(#glow)"/>
    <g fill="#8868FF">
      <polygon points="930,0 990,0 810,300 750,300" opacity=".07"/>
      <polygon points="1020,0 1050,0 870,300 840,300" opacity=".10"/>
      <polygon points="1090,0 1200,0 1200,40 1044,300 910,300" opacity=".05"/>
      <polygon points="150,0 180,0 0,300 0,250" opacity=".08"/>
      <polygon points="230,0 320,0 140,300 50,300" opacity=".05"/>
    </g>
    <rect class="p" x="96" y="70" width="7" height="7"/>
    <rect class="p d1" x="176" y="238" width="5" height="5"/>
    <rect class="p d2" x="338" y="52" width="5" height="5"/>
    <rect class="p d3" x="452" y="248" width="6" height="6"/>
    <rect class="p d4" x="742" y="44" width="6" height="6"/>
    <rect class="p d1" x="884" y="236" width="5" height="5"/>
    <rect class="p d2" x="1006" y="92" width="7" height="7"/>
    <rect class="p d3" x="1104" y="198" width="5" height="5"/>
    <rect class="p d4" x="632" y="262" width="4" height="4"/>
    <text class="t" x="611" y="162" text-anchor="middle" font-size="96" letter-spacing="22" fill="url(#txt)">OBLICUA</text>
    <text class="s" x="603" y="210" text-anchor="middle" font-size="19" letter-spacing="6" fill="#B9A6FF">plugins · servidores · diseño para minecraft</text>
    <rect x="560" y="236" width="80" height="2" rx="1" fill="#8868FF"/>
  </g>
</svg>
